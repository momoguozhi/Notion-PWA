<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#202124">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="记录台">
  <title>记录台 · 分类照片 PWA</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icon-180.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-mark">N</span><div><strong>记录台</strong><small>分类与照片 PWA · v0.2</small></div></div>
    <nav class="database-tabs" aria-label="数据库切换">
      <button class="tab active" data-db="purchases">采购清单 <span id="purchase-count"></span></button>
      <button class="tab" data-db="sales">售出记录 <span id="sale-count"></span></button>
    </nav>
  </header>

  <div class="demo-notice" role="status"><strong>模拟／未连接 Notion</strong>：修改会在本机暂存，不会发送网络请求或写入真实 Notion。<span id="sync-state">本地状态准备中</span></div>

  <main>
    <section id="home-controls" class="home-controls" aria-label="手机首页布局">
      <div class="layout-switch" role="group" aria-label="首页布局">
        <button data-layout="category" class="active">分类导航</button>
        <button data-layout="gallery">图片图库</button>
        <button data-layout="custom">自定义组合</button>
      </div>
      <label class="column-setting">每行 <select id="column-count" aria-label="每行列数"><option>3</option><option selected>4</option><option>5</option><option>6</option></select> 列</label>
    </section>

    <section id="category-browser" class="category-browser" aria-label="分类导航">
      <div class="category-row-wrap">
        <div id="major-categories" class="category-scroll"></div>
        <button id="add-major" class="category-fixed" aria-label="新增大分类">＋</button>
      </div>
      <div class="category-row-wrap sub-row">
        <div id="sub-categories" class="category-scroll"></div>
        <button id="add-sub" class="category-fixed" aria-label="新增小分类">＋</button>
        <button id="manage-categories" class="category-manage">管理</button>
      </div>
    </section>

    <section class="toolbar" aria-label="记录操作">
      <label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索当前数据库…" autocomplete="off"></label>
      <select id="filter" aria-label="筛选条件"></select>
      <button id="add-record" class="primary">＋ 新增记录</button>
      <button id="paste-grid" class="desktop-action">粘贴表格</button>
      <button id="reset-data" class="quiet" title="恢复初始模拟数据">重置</button>
    </section>

    <section class="content-shell">
      <div class="view-heading">
        <div><h1 id="view-title">采购清单</h1><p id="view-subtitle"></p></div>
        <span class="desktop-hint">点击单元格选中；双击记录或使用“编辑”打开完整字段</span>
      </div>
      <div id="desktop-table" class="table-wrap" tabindex="0" aria-label="响应式数据表格"></div>
      <div id="mobile-home" class="mobile-home" aria-live="polite"></div>
      <div id="empty-state" class="empty" hidden>没有符合条件的记录。</div>
    </section>
  </main>

  <dialog id="record-dialog" class="record-dialog">
    <form id="record-form" method="dialog">
      <header class="dialog-header">
        <button type="button" id="back-record" class="icon-button" hidden aria-label="返回上一条记录">←</button>
        <div><small id="dialog-db"></small><h2 id="dialog-title"></h2></div>
        <button type="button" class="icon-button close-dialog" aria-label="关闭">×</button>
      </header>
      <div id="form-fields" class="form-fields"></div>
      <footer class="dialog-footer">
        <button type="button" id="copy-record">复制整条记录</button>
        <button type="button" id="delete-record" class="danger">删除</button>
        <span class="footer-spacer"></span>
        <button type="button" class="close-dialog">取消</button>
        <button type="submit" class="primary">保存修改</button>
      </footer>
    </form>
  </dialog>

  <dialog id="category-dialog" class="category-dialog">
    <form method="dialog" id="category-form">
      <header class="dialog-header"><div><small>本地分类管理</small><h2>分类、排序与批量调整</h2></div><button type="button" class="icon-button close-category">×</button></header>
      <div class="category-manager-body">
        <section><div class="section-title"><h3>大分类</h3><button type="button" data-category-add="major">＋ 新增</button></div><div id="major-manager" class="sortable-list"></div></section>
        <section><div class="section-title"><h3>所选大分类的小分类</h3><button type="button" data-category-add="sub">＋ 新增</button></div><p class="manager-tip">拖动 ≡ 调整顺序；有记录使用的分类不能删除。</p><div id="sub-manager" class="sortable-list"></div></section>
        <section class="batch-panel"><div class="section-title"><h3>批量调整记录</h3></div><label>目标小分类 <select id="batch-target"></select></label><div id="batch-records" class="batch-records"></div><button type="button" id="preview-batch" class="primary">预览变更</button></section>
      </div>
      <footer class="dialog-footer"><span class="muted">分类变更只进入本地待同步队列</span><span class="footer-spacer"></span><button type="button" class="close-category">完成</button></footer>
    </form>
  </dialog>

  <dialog id="batch-dialog" class="batch-dialog">
    <form method="dialog"><header class="dialog-header"><div><small>执行前确认</small><h2>批量调整预览</h2></div><button type="button" class="icon-button close-batch">×</button></header><div id="batch-preview" class="batch-preview"></div><footer class="dialog-footer"><button type="button" class="close-batch">取消</button><span class="footer-spacer"></span><button type="button" id="confirm-batch" class="primary">确认调整</button></footer></form>
  </dialog>

  <dialog id="paste-dialog" class="paste-dialog">
    <form method="dialog" id="paste-form">
      <header class="dialog-header"><div><small>Windows / Excel</small><h2>粘贴多行多列</h2></div><button type="button" class="icon-button close-paste">×</button></header>
      <p id="paste-help"></p>
      <textarea id="paste-input" rows="9" placeholder="从 Excel 复制单元格后在此粘贴…"></textarea>
      <div id="paste-preview" class="paste-preview"></div>
      <footer class="dialog-footer"><button type="button" class="close-paste">取消</button><button type="submit" class="primary">应用数据</button></footer>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
